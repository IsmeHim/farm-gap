services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farmgap-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      # ชี้ไปยัง Laragon MySQL ที่รันอยู่บน Windows Host โดยตรง
      - DB_HOST=host.docker.internal
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=farmgap
      - PORT=4000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./frontend/dist:/frontend/dist:ro
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: farmgap-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  ngrok:
    image: ngrok/ngrok:latest
    container_name: farmgap-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "backend:4000"
      - "--domain=${NGROK_DOMAIN:-molecular-repackage-fraction.ngrok-free.dev}"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040" # หน้าเว็บ Web Inspector ของ ngrok: http://localhost:4040
    depends_on:
      - backend
